<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catatan Keuangan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <h1>💰 Catatan Keuangan</h1>
      <div class="actions">
        <span id="saveStatus" class="save-status">Tersimpan otomatis</span>
        <button class="btn ghost" id="btnExport" type="button">Ekspor</button>
        <button class="btn ghost" id="btnImport" type="button">Impor</button>
        <button class="btn danger" id="btnReset" type="button">Hapus Semua</button>
        <input type="file" id="fileImport" accept="application/json" hidden>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="cards">
      <div class="card">
        <span class="label">Saldo</span>
        <strong id="balance" class="value">Rp 0</strong>
      </div>
      <div class="card income">
        <span class="label">Total Pemasukan</span>
        <strong id="totalIncome" class="value">Rp 0</strong>
      </div>
      <div class="card expense">
        <span class="label">Total Pengeluaran</span>
        <strong id="totalExpense" class="value">Rp 0</strong>
      </div>
    </section>

    <div class="grid">
      <section class="panel">
        <h2>Tambah Transaksi</h2>
        <form id="form" autocomplete="off">
          <div class="toggle" role="radiogroup" aria-label="Jenis transaksi">
            <label class="opt"><input type="radio" name="type" value="income" checked><span>Pemasukan</span></label>
            <label class="opt"><input type="radio" name="type" value="expense"><span>Pengeluaran</span></label>
          </div>

          <label class="field">
            <span>Keterangan</span>
            <input type="text" id="desc" placeholder="Contoh: Gaji bulanan" required maxlength="80">
          </label>

          <label class="field">
            <span>Jumlah (Rp)</span>
            <input type="text" id="amount" inputmode="numeric" placeholder="0" required>
          </label>

          <div class="row">
            <label class="field">
              <span>Kategori</span>
              <select id="category"></select>
            </label>
            <label class="field">
              <span>Tanggal</span>
              <input type="date" id="date" required>
            </label>
          </div>

          <button class="btn primary full" type="submit">Simpan Transaksi</button>
        </form>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Diagram Batang</h2>
          <div class="seg" role="tablist">
            <button type="button" class="seg-btn active" data-mode="monthly">Per Bulan</button>
            <button type="button" class="seg-btn" data-mode="category">Pengeluaran per Kategori</button>
          </div>
        </div>
        <div class="chart-box">
          <canvas id="chart"></canvas>
          <div id="tooltip" class="tooltip" hidden></div>
          <p id="chartEmpty" class="empty" hidden>Belum ada data untuk ditampilkan.</p>
        </div>
        <div class="legend" id="legend"></div>
      </section>
    </div>

    <section class="panel">
      <div class="panel-head">
        <h2>Riwayat Transaksi</h2>
        <select id="filter">
          <option value="all">Semua</option>
          <option value="income">Pemasukan</option>
          <option value="expense">Pengeluaran</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Tanggal</th><th>Keterangan</th><th>Kategori</th><th class="r">Jumlah</th><th></th></tr>
          </thead>
          <tbody id="list"></tbody>
        </table>
      </div>
      <p id="listEmpty" class="empty" hidden>Belum ada transaksi. Tambahkan yang pertama di atas.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
